<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Bean &amp; Brew</title>
  <link rel="icon" href="static/images/favicon.svg" />
  <link rel="stylesheet" href="static/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="logo"><span class="logo-mark">☕</span> Bean &amp; Brew</a>
    <ul><li><a href="index.html">Home</a></li><li><a href="products.html">Products</a></li><li><a class="order-link" href="order.html">Order</a></li><li><a href="about.html">About</a></li><li><a class="active" href="contact.html">Contact</a></li></ul>
    <button id="dark-mode-btn" class="theme-toggle" type="button"><i class="fa-solid fa-moon"></i></button>
  </nav>

  <main class="page contact-page">
    <div class="section-head"><h1>Contact Us</h1><p>We'd love to hear from you. Whether it's a question about our roasts or just a friendly hello, drop us a message below.</p></div>
    <section class="form-shell">
      <form id="contact-form" class="form" novalidate>
        <div class="form-grid">
          <label>Name<input type="text" id="c-name" placeholder="Your name" /></label>
          <label>Email<input type="email" id="c-email" placeholder="you@example.com" /></label>
          <label class="full">Message<textarea id="c-message" rows="6" placeholder="Write your message here..."></textarea></label>
        </div>
        <p id="form-error" class="error"></p><p id="form-success" class="success"></p>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="footer"><div class="footer-grid"><div><h3>Bean &amp; Brew</h3><p>© 2026 Bean &amp; Brew Coffee Shop</p></div><div><h3>Contact</h3><p>Email: coffee@beanbrew.com</p></div><div><h3>Social</h3><div class="socials"><a href="#"><i class="fa-brands fa-instagram"></i></a><a href="#"><i class="fa-brands fa-facebook-f"></i></a></div></div></div></footer>
  <button id="scroll-top-btn" type="button">↑</button><script src="static/js/script.js"></script>
</body>
</html>
